name: Android 构建

# 什么时候触发：
#   1. 往 main / master 推代码，且改动了 android/ 目录
#   2. 发 PR 时先验证能不能编译过
#   3. 手动点按钮触发（可以顺便指定后端地址）
# ⚠️ 关于第一次运行：
# workflow 文件本身**首次**被推送上去时，GitHub 处理那一次 push 事件时
# 这个 workflow 还没注册完，所以不会触发构建 —— 这是 GitHub 的已知行为，
# 不是配置写错了。
# 补救办法：去仓库的 Actions 页面点一次
#     Android 构建 → Run workflow → 选 main → Run
# 之后只要改动 android/ 下的代码，每次 push 都会自动跑。
on:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: '后端地址（例如 https://api.your-domain.com/），留空则用默认占位值'
        required: false
        default: ''

# 同一个分支连续推送时，取消上一次还在跑的构建，省额度
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译并打包
    runs-on: ubuntu-latest

    defaults:
      run:
        # 所有 run 步骤都在 android/ 目录下执行
        working-directory: android

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # ---------- 环境 ----------
      # JDK 必须是 17：AGP 8.13.2 不支持 JDK 21+，KSP 也需要 17
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 的 ubuntu runner 自带 Android SDK，但默认不带 android-36，
      # 必须显式装，否则编译时报 "failed to find target with hash string android-36"
      # ⚠️ 这里必须用 @v4。@v3 在 Ubuntu 24.04 的 runner 上会直接失败
      # （实测 15 秒就挂在这一步，后面的步骤全部 skipped，报错还看不出原因）。
      # v4 会下载 cmdline-tools、接受许可、并把 sdkmanager 加进 PATH。
      - name: 安装 Android SDK 组件
        uses: android-actions/setup-android@v4

      - name: 补齐 platform 36 与 build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # 自动处理 Gradle 依赖缓存，第二次构建会快很多
      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 确保 gradlew 可执行
        run: chmod +x gradlew

      # ---------- 签名密钥 ----------
      # 仓库 Secrets 里配了 KEYSTORE_BASE64 就用真密钥签名；
      # 没配就退化成 debug 签名，保证 fork 出去的人也能构建成功。
      - name: 准备签名密钥
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::未配置 KEYSTORE_BASE64，本次使用 debug 签名"
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" \
            "${{ secrets.KEY_ALIAS }}" \
            "${{ secrets.KEY_PASSWORD }}" > keystore.properties
          echo "has_keystore=true" >> "$GITHUB_OUTPUT"

      # ---------- 构建 ----------
      # 注意：这里不写 gradle.properties 里的地址，全部靠 -P 注入，
      # 保证「代码里没有环境相关的常量」这条规则不被破坏。
      # ⚠️ 这里必须覆盖 jvmargs。
      # gradle.properties 里设了 -Dfile.encoding=GBK，那是为了应对 Windows 上的
      # 中文项目路径（G:\workbuddy\任务路径\...），本地不加它会报 ClassNotFoundException。
      # 但 Linux runner 的工作目录是纯 ASCII 的
      # /home/runner/work/Fridge-Prophet/Fridge-Prophet，
      # GBK 在那里不但没用，还会让 UTF-8 源码里的中文被按 GBK 解码，直接编译失败。
      # 用 -Dorg.gradle.jvmargs 整体覆盖掉它，平台差异只在这一行处理。
      - name: 构建 debug 包
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3072m -XX:+UseParallelGC"
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}

      - name: 构建 release 包
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3072m -XX:+UseParallelGC"
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}

      # ---------- 产物 ----------
      - name: 上传 debug 包
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 上传 release 包
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 构建挂了的话，把完整报告传上去，方便在网页上直接看哪一行出错
      - name: 上传构建报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: android/app/build/reports/**
          if-no-files-found: ignore
