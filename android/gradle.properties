# JVM 内存。Compose + Hilt 的注解处理比较吃内存，2G 起步
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=GBK -XX:+UseParallelGC

# ---- Windows 非 ASCII 路径 ----
# 本项目位于 G:\workbuddy\任务路径\Fridge-Prophet，路径里有中文。
# AGP 默认拒绝在非 ASCII 路径下构建（怕 aapt2 / D8 处理路径时编码出错），
# 这个开关跳过该检查。配合上面 jvmargs 里的 -Dfile.encoding=GBK，
# 让 JVM 用 UTF-8 解码路径，实测可以正常编译打包。
# 如果以后资源处理或打包阶段报奇怪的路径错误，把工程挪到纯英文目录即可根治。
android.overridePathCheck=true

# 并行构建与缓存，首次之后编译会快很多
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# KSP 增量
ksp.incremental=true
