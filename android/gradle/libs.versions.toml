[versions]
agp = "8.13.2"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.5"

# Hilt 必须停在 2.58，不能升。
# Dagger 2.59（2026-01）给 Hilt Gradle 插件加了 AGP 9 支持，并明确
# 「AGP 9 is now a requirement」；2.59.1 进一步把最低 AGP 版本硬性设为 9.0.0。
# 而升 AGP 9 会连锁要求 Gradle 9.1+，且 AGP 9 默认开启的 android.newDsl
# 与 org.jetbrains.kotlin.android 插件冲突 —— 而 Kotlin 又因为 KSP 没有
# 2.3+ 的对应版本升不上去。所以只能让 Hilt 停在支持 AGP 8.x 的最后一版。
hilt = "2.58"

# hilt-navigation-compose 也必须停在 1.3.0。
# 1.4.0 里的 hilt-lifecycle-viewmodel-compose 依赖 lifecycle-viewmodel-compose 2.11.0，
# 而 2.11.0 要求 compileSdk 37 + AGP 9.1.0 —— 我们的 AGP 8.13.2 上限是 compileSdk 36。
# 1.3.0 依赖的是 lifecycle-viewmodel-compose 2.9.1，正好落在 compileSdk 36 的能力范围内。
# 顺带一提，1.3.0 传递的 hilt-android 是 2.54，低于我们显式的 2.58，不会反向顶版本。
hiltNavigationCompose = "1.3.0"

composeBom = "2025.12.01"
coreKtx = "1.17.0"
activityCompose = "1.11.0"
lifecycle = "2.9.4"
navigationCompose = "2.9.5"
datastore = "1.1.7"
camerax = "1.6.2"

retrofit = "2.12.0"
okhttp = "4.12.0"
kotlinxSerialization = "1.9.0"
retrofitSerializationConverter = "1.0.0"

[libraries]
# ---- AndroidX 基础 ----
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# ---- Compose（版本由 BOM 统一管理）----
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# ---- CameraX 拍照 ----
camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

# ---- 依赖注入 ----
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
# 说明：现在 hiltViewModel() 从 androidx.hilt.lifecycle.viewmodel.compose 导入
# （旧包 androidx.hilt.navigation.compose 已废弃），那个新包由 hilt-navigation-compose
# 传递依赖 hilt-lifecycle-viewmodel-compose 提供，所以这里保留这个声明即可。

# ---- 网络 ----
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-serialization = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitSerializationConverter" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# 说明：图片加载**没有引入第三方库**（试过 Coil 3，会让 Gradle 依赖图序列化失败）。
# 用项目里已有的 OkHttp + BitmapFactory 自己实现，见 ui/components/RemoteImage.kt。

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
